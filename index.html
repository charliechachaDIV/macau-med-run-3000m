<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026第一屆澳門醫療界運動會 - 3000米田徑比賽報名</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="date"], select { width: 100%; padding: 8px; box-sizing: border-box; }
        .checkbox-group { display: flex; align-items: start; gap: 10px; background: #f9f9f9; padding: 10px; border-radius: 5px; }
        button { width: 100%; padding: 12px; background-color: #0056b3; color: white; border: none; font-size: 16px; cursor: pointer; border-radius: 5px; }
        button:disabled { background-color: #ccc; }
        #resultMessage { margin-top: 20px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

    <h2>3000米田徑比賽報名表</h2>
    
    <form id="regForm">
        <div class="form-group"><label>中文姓名 *</label><input type="text" id="name" required></div>
        <div class="form-group"><label>性別 *</label>
            <select id="gender" required><option value="">請選擇</option><option value="男">男</option><option value="女">女</option></select>
        </div>
        <div class="form-group"><label>出生日期 *</label><input type="date" id="dob" required></div>
        <div class="form-group"><label>報名組別 *</label>
            <select id="group" required>
                <option value="">請選擇</option>
                <option value="男子公開組">男子公開組</option><option value="男子先進組">男子先進組</option>
                <option value="女子公開組">女子公開組</option><option value="女子先進組">女子先進組</option>
            </select>
        </div>
        <div class="form-group"><label>身份證明文件號碼 *</label><input type="text" id="id_num" required></div>
        <div class="form-group"><label>醫療人員執照編號/工作證編號 *</label><input type="text" id="license_num" required></div>
        <div class="form-group"><label>所屬機構 *</label><input type="text" id="org" required></div>
        <div class="form-group"><label>員工證編號</label><input type="text" id="emp_id"></div>
        <div class="form-group"><label>聯絡電話 *</label><input type="text" id="phone" required></div>
        <div class="form-group"><label>緊急聯絡人 *</label><input type="text" id="emerg_contact" required></div>
        <div class="form-group"><label>緊急聯絡電話 *</label><input type="text" id="emerg_phone" required></div>

        <div class="checkbox-group">
            <input type="checkbox" id="agreement" required>
            <label for="agreement" style="font-weight: normal; font-size: 0.9em;">
                <b>健康及參賽聲明：</b>本人確認以上所填資料真實、完整。本人聲明目前身體狀況適合參加比賽，已了解參賽風險並願意遵守大會指示。本人已閱讀並同意上述聲明。
            </label>
        </div>

        <button type="submit" id="submitBtn">送出報名資料</button>
    </form>

    <div id="resultMessage"></div>

    <script>
        document.getElementById('regForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const resultDiv = document.getElementById('resultMessage');
            btn.disabled = true;
            btn.innerText = "資料處理中，正在生成報名表...";

            const data = {
                name: document.getElementById('name').value,
                gender: document.getElementById('gender').value,
                dob: document.getElementById('dob').value,
                group: document.getElementById('group').value,
                id_num: document.getElementById('id_num').value,
                license_num: document.getElementById('license_num').value,
                org: document.getElementById('org').value,
                emp_id: document.getElementById('emp_id').value,
                phone: document.getElementById('phone').value,
                emerg_contact: document.getElementById('emerg_contact').value,
                emerg_phone: document.getElementById('emerg_phone').value
            };

            // ⚠️ 將下方的 URL 替換成你剛剛部署 Apps Script 獲得的網址
            const scriptURL = 'https://script.google.com/macros/s/AKfycbzUnOSA_129IuERYR1hA1c814U9eNqouDeny1TtI3r-SsSMcLcCg3RF1SBiPyN9dYb5/exec';

            fetch(scriptURL, {
                method: 'POST',
                body: JSON.stringify(data),
            })
            .then(res => res.json())
            .then(response => {
                if(response.status === "success"){
                    resultDiv.innerHTML = `<span style="color:green;">報名成功！</span><br><br>
                    <a href="${response.pdfUrl}" target="_blank" style="display:inline-block; padding:10px; background:#28a745; color:white; text-decoration:none; border-radius:5px;">📥 點此下載/查看您的專屬 PDF 報名表</a>`;
                    document.getElementById('regForm').reset();
                    btn.style.display = "none";
                } else {
                    resultDiv.innerHTML = `<span style="color:red;">發生錯誤，請稍後再試。</span>`;
                    btn.disabled = false;
                    btn.innerText = "送出報名資料";
                }
            })
            .catch(error => {
                resultDiv.innerHTML = `<span style="color:red;">網路錯誤，請稍後再試。</span>`;
                btn.disabled = false;
                btn.innerText = "送出報名資料";
            });
        });
    </script>
</body>
</html>
